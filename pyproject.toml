[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsml-chainpinn-paper"
version = "0.3.0"
description = "TSML-ChainPINN: staged physics-informed learning for transient cavitation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.23", "torch>=2.1"]

[project.optional-dependencies]
vtk = ["pyvista>=0.43", "vtk>=9.2"]
test = ["pytest>=7"]
viz = ["matplotlib>=3.7"]
all = ["pyvista>=0.43", "vtk>=9.2", "pytest>=7", "matplotlib>=3.7"]

[project.scripts]
tsml = "tsml_chainpinn.cli:main"

[project.urls]
Repository = "https://github.com/zheng17543078175-crypto/TSML-ChainPINN"
Documentation = "https://github.com/zheng17543078175-crypto/TSML-ChainPINN/tree/main/docs"
Issues = "https://github.com/zheng17543078175-crypto/TSML-ChainPINN/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
tsml_chainpinn = ["defaults/*.json"]
